<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会合分析 · 碰撞预警与机动协同</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --red:#f85149; --yellow:#d29922; --green:#3fb950; --blue:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header .clock { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 420px 1fr; gap:12px; padding:12px 20px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
  .panel h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { padding:5px 7px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--dim); font-weight:600; }
  tr.clickable { cursor:pointer; } tr.clickable:hover { background:#1c2129; }
  tr.selected { background:#1f2a3a; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .RED { background:rgba(248,81,73,.15); color:var(--red); border:1px solid var(--red); }
  .YELLOW { background:rgba(210,153,34,.15); color:var(--yellow); border:1px solid var(--yellow); }
  .GREEN { background:rgba(63,185,80,.15); color:var(--green); border:1px solid var(--green); }
  .tag { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; background:#21262d; color:var(--dim); border:1px solid var(--border); }
  .warn-banner { padding:8px 12px; border-radius:6px; margin-bottom:8px; font-size:13px; }
  .warn-banner.RED { background:rgba(248,81,73,.12); }
  .warn-banner.YELLOW { background:rgba(210,153,34,.12); }
  button { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px;
           padding:4px 12px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--blue); }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input,textarea,select { background:#0d1117; color:var(--fg); border:1px solid var(--border);
           border-radius:6px; padding:4px 8px; font-size:12px; width:100%; }
  textarea { font-family:ui-monospace,monospace; }
  label { display:block; font-size:11px; color:var(--dim); margin:6px 0 2px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mono { font-family:ui-monospace,monospace; font-size:11px; }
  .frozen { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:8px; margin:6px 0; }
  .frozen h4 { margin:0 0 4px; font-size:11px; color:var(--blue); }
  .muted { color:var(--dim); }
  .ok { color:var(--green); } .err { color:var(--red); }
  #toast { position:fixed; top:12px; right:12px; z-index:9; max-width:420px; }
  .toast { padding:10px 14px; border-radius:8px; margin-bottom:8px; font-size:13px;
           background:var(--panel); border:1px solid var(--border); box-shadow:0 4px 16px rgba(0,0,0,.5); }
  .toast.error { border-color:var(--red); } .toast.success { border-color:var(--green); }
  svg.chart { width:100%; height:140px; background:#0d1117; border-radius:6px; }
  a { color:var(--blue); text-decoration:none; }
  details { margin:4px 0; } summary { cursor:pointer; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🛰️ 会合分析 · 碰撞预警与机动协同</h1>
  <span class="clock" id="clock"></span>
  <span class="muted" style="font-size:12px">预警 API: <a href="/api/warnings">/api/warnings</a> · 导出: <a href="/api/coordination/export?format=csv">CSV</a> · <a href="/audit">🔒 只读审计回放</a></span>
</header>
<div id="toast"></div>
<main>
  <div>
    <div class="panel">
      <h2>活动预警</h2>
      <div id="warnings"><span class="muted">加载中…</span></div>
    </div>
    <div class="panel">
      <h2>会合事件</h2>
      <table id="events"><thead><tr>
        <th>事件</th><th>风险</th><th>Pc</th><th>脱靶(km)</th><th>TCA</th><th>版本</th><th>承诺</th>
      </tr></thead><tbody></tbody></table>
    </div>
    <div class="panel">
      <h2>接收轨道解（多来源）</h2>
      <label>目标</label><select id="ing-object"></select>
      <label>来源</label><input id="ing-source" value="INTERNAL" placeholder="如 18SPCS / CDM / PARTNER-A">
      <label>观测时点 (ISO)</label><input id="ing-epoch" placeholder="2026-10-06T00:00:00Z">
      <label>状态向量 [x,y,z,vx,vy,vz] (km, km/s)</label>
      <input id="ing-state" class="mono" placeholder="7000,0,0,0,7.546,0">
      <label>位置协方差 3x3 (km²，JSON)</label>
      <textarea id="ing-cov" rows="2" class="mono">[[0.01,0,0],[0,0.01,0],[0,0,0.01]]</textarea>
      <div style="margin-top:8px"><button class="primary" onclick="ingest()">接收并筛查</button></div>
    </div>
    <div class="panel">
      <h2>接收对方协同消息</h2>
      <label>消息 ID（幂等键）</label><input id="msg-id" class="mono" placeholder="MSG-0001">
      <div class="grid2">
        <div><label>对方标识</label><input id="msg-cp" value="OPERATOR-B"></div>
        <div><label>事件</label><select id="msg-event"></select></div>
      </div>
      <div class="grid2">
        <div><label>类型</label><select id="msg-type">
          <option>PLAN_SHARE</option><option>PLAN_UPDATE</option><option>AGREEMENT</option><option>CANCEL</option><option>ACK</option>
        </select></div>
        <div><label>版本</label><input id="msg-version" type="number" value="1"></div>
      </div>
      <label>载荷 (JSON)</label><textarea id="msg-payload" rows="2" class="mono">{}</textarea>
      <div style="margin-top:8px"><button class="primary" onclick="sendMessage()">接收消息</button></div>
    </div>
  </div>

  <div>
    <div class="panel" id="detail-panel">
      <h2>事件详情 <span id="d-id" class="mono"></span></h2>
      <div id="d-summary" class="muted">选择左侧事件查看详情</div>
      <div id="d-chart"></div>
      <h2 style="margin-top:12px">版本历史（单调递增，只追加）</h2>
      <table id="d-versions"><thead><tr>
        <th>版本</th><th>观测时点(主/次)</th><th>TCA</th><th>脱靶(km)</th><th>Pc</th><th>风险</th><th>时间</th>
      </tr></thead><tbody></tbody></table>
      <details id="d-rejected-wrap" style="display:none"><summary>被单调规则拒绝的迟到评估</summary>
        <div id="d-rejected" class="mono"></div></details>
    </div>

    <div class="panel" id="cand-panel" style="display:none">
      <h2>机动候选</h2>
      <table id="d-cands"><thead><tr>
        <th>候选</th><th>基于版本</th><th>Δv(m/s)</th><th>燃料(kg)</th><th>执行时刻</th><th>状态</th><th>操作</th>
      </tr></thead><tbody></tbody></table>
      <details><summary>提交新候选</summary>
        <div class="grid2">
          <div><label>机动目标</label><select id="c-object"></select></div>
          <div><label>运营方</label><input id="c-operator" value="OPS-A"></div>
        </div>
        <label>Δv 矢量 (m/s)</label><input id="c-dv" class="mono" placeholder="0,0.5,0">
        <div class="grid2">
          <div><label>执行时刻 (ISO)</label><input id="c-exec" placeholder="2026-10-07T00:00:00Z"></div>
          <div><label>预计燃料 (kg)</label><input id="c-fuel" type="number" value="1"></div>
        </div>
        <div style="margin-top:8px"><button class="primary" onclick="submitCandidate()">提交候选</button></div>
      </details>
    </div>

    <div class="panel" id="cmt-panel" style="display:none">
      <h2>机动承诺（不可变 · 单调版本化）</h2>
      <div id="d-cmts"></div>
    </div>

    <div class="panel" id="coord-panel" style="display:none">
      <h2>协同记录 <a id="export-json" href="#" style="font-size:11px">导出JSON</a> · <a id="export-csv" href="#" style="font-size:11px">导出CSV</a></h2>
      <table id="d-msgs"><thead><tr>
        <th>方向</th><th>消息</th><th>类型</th><th>版本</th><th>状态</th><th>时间</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let objects = [], events = [], selectedEvent = null;

function toast(msg, ok=true) {
  const d = document.createElement('div');
  d.className = 'toast ' + (ok ? 'success' : 'error');
  d.textContent = msg;
  $('toast').appendChild(d);
  setTimeout(() => d.remove(), 5000);
}
async function api(path, opts={}) {
  const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error?.message || r.statusText);
  return data;
}
const fmtPc = (pc) => pc === 0 ? '0' : pc.toExponential(2);
const fmtT = (iso) => iso ? iso.replace('T',' ').replace(/\.\d+Z$/,'Z') : '-';

async function refresh() {
  $('clock').textContent = new Date().toISOString();
  objects = await api('/api/objects');
  events = await api('/api/conjunctions');
  const warns = await api('/api/warnings');

  $('warnings').innerHTML = warns.warnings.length === 0
    ? '<span class="ok">当前无 YELLOW 以上预警</span>'
    : warns.warnings.map(w => `<div class="warn-banner ${w.level}">
        <b>${w.level}</b> ${w.eventId} · Pc=${fmtPc(w.pc)} · 脱靶 ${w.missDistanceKm.toFixed(2)} km · TCA ${fmtT(w.tca)}
        · 事件v${w.eventVersion} / 承诺v${w.commitmentHead}</div>`).join('');

  $('events').querySelector('tbody').innerHTML = events.map(e => `
    <tr class="clickable ${selectedEvent===e.id?'selected':''}" onclick="selectEvent('${e.id}')">
      <td class="mono">${e.id}</td>
      <td>${e.head ? `<span class="badge ${e.head.riskLevel}">${e.head.riskLevel}</span>` : '-'}</td>
      <td class="mono">${e.head ? fmtPc(e.head.pc) : '-'}</td>
      <td class="mono">${e.head ? e.head.missDistanceKm.total.toFixed(3) : '-'}</td>
      <td class="mono">${e.head ? fmtT(e.head.tca) : '-'}</td>
      <td>v${e.currentVersion}</td><td>v${e.commitmentHead}</td>
    </tr>`).join('');

  const objOpts = objects.map(o => `<option value="${o.id}">${o.name} (${o.operator})</option>`).join('');
  $('ing-object').innerHTML = objOpts;
  $('msg-event').innerHTML = events.map(e => `<option>${e.id}</option>`).join('');
  if (selectedEvent) await selectEvent(selectedEvent, true);
}

async function selectEvent(id, silent=false) {
  selectedEvent = id;
  const e = await api('/api/conjunctions/' + id);
  const msgs = await api('/api/coordination/messages?eventId=' + id);
  $('d-id').textContent = e.id;
  const head = e.versions[e.versions.length-1];
  $('d-summary').innerHTML = head ? `
    <span class="badge ${head.riskLevel}">${head.riskLevel}</span>
    状态 ${e.status} · 主目标 <span class="mono">${e.primaryObjectId.slice(0,8)}…</span>
    次目标 <span class="mono">${e.secondaryObjectId.slice(0,8)}…</span><br>
    TCA <b>${fmtT(head.tca)}</b> · 脱靶 <b>${head.missDistanceKm.total.toFixed(3)} km</b>
    (R ${head.missDistanceKm.radial.toFixed(2)} / I ${head.missDistanceKm.inTrack.toFixed(2)} / C ${head.missDistanceKm.crossTrack.toFixed(2)})
    · Pc <b>${fmtPc(head.pc)}</b> · 相对速度 ${head.relativeVelocityKmS.toFixed(2)} km/s` : '无评估';

  // Pc / 脱靶 版本演化图
  if (e.versions.length) {
    const W=560,H=140,P=24;
    const pcs = e.versions.map(v=>Math.log10(Math.max(v.pc,1e-12)));
    const lo=-12, hi=0;
    const x = i => P + i*(W-2*P)/Math.max(1,e.versions.length-1);
    const y = v => H-P - (v-lo)/(hi-lo)*(H-2*P);
    const pts = pcs.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    $('d-chart').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}">
      ${[-4,-6,-8].map(g=>`<line x1="${P}" y1="${y(g)}" x2="${W-P}" y2="${y(g)}" stroke="#30363d" stroke-dasharray="3"/>
        <text x="2" y="${y(g)+3}" fill="#8b949e" font-size="9">1e${g}</text>`).join('')}
      <polyline points="${pts}" fill="none" stroke="#58a6ff" stroke-width="2"/>
      ${pcs.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${e.versions[i].riskLevel==='RED'?'#f85149':e.versions[i].riskLevel==='YELLOW'?'#d29922':'#3fb950'}">
        <title>v${e.versions[i].version}: Pc=${fmtPc(e.versions[i].pc)}, 脱靶 ${e.versions[i].missDistanceKm.total.toFixed(2)}km</title></circle>`).join('')}
      <text x="${W-P}" y="12" fill="#8b949e" font-size="9" text-anchor="end">Pc 随事件版本演化 (log10)</text>
    </svg>`;
  }

  $('d-versions').querySelector('tbody').innerHTML = e.versions.map(v => `
    <tr><td>v${v.version}</td>
      <td class="mono" style="font-size:10px">${fmtT(v.inputs.primaryEpoch)}<br>${fmtT(v.inputs.secondaryEpoch)}</td>
      <td class="mono">${fmtT(v.tca)}</td><td class="mono">${v.missDistanceKm.total.toFixed(3)}</td>
      <td class="mono">${fmtPc(v.pc)}</td><td><span class="badge ${v.riskLevel}">${v.riskLevel}</span></td>
      <td class="mono">${fmtT(v.createdAt)}</td></tr>`).join('');

  if (e.rejectedAssessments.length) {
    $('d-rejected-wrap').style.display = 'block';
    $('d-rejected').textContent = JSON.stringify(e.rejectedAssessments, null, 2);
  } else $('d-rejected-wrap').style.display = 'none';

  // 候选
  $('cand-panel').style.display = 'block';
  $('c-object').innerHTML = [e.primaryObjectId, e.secondaryObjectId].map(oid => {
    const o = objects.find(x=>x.id===oid);
    return `<option value="${oid}">${o ? o.name : oid}</option>`;
  }).join('');
  $('d-cands').querySelector('tbody').innerHTML = e.candidates.map(c => `
    <tr><td class="mono">${c.id}</td><td>v${c.eventVersion}</td>
      <td class="mono">${(c.dvMagnitudeKmS*1000).toFixed(2)}</td>
      <td class="mono">${c.expectedFuelKg}</td><td class="mono">${fmtT(c.executionEpoch)}</td>
      <td><span class="tag">${c.status}</span></td>
      <td>${c.status==='SUBMITTED' ? `<button onclick="approve('${c.id}', ${e.commitmentHead})">批准</button>
        <button onclick="rejectCand('${c.id}')">拒绝</button>` : ''}</td></tr>`).join('');

  // 承诺（含冻结快照）
  $('cmt-panel').style.display = 'block';
  $('d-cmts').innerHTML = e.commitments.length === 0 ? '<span class="muted">暂无承诺</span>' :
    e.commitments.map(c => `
    <div class="frozen">
      <h4>${c.id} · 承诺 v${c.version} · <span class="tag">${c.status}</span> · 基于事件 v${c.eventVersion}</h4>
      <div class="mono" style="font-size:11px">
        Δv=${(c.maneuver.dvMagnitudeKmS*1000).toFixed(2)} m/s @ ${fmtT(c.maneuver.executionEpoch)}<br>
        🔒 燃料冻结: 预算 ${c.frozen.fuel.budgetKg} kg − 已耗 ${c.frozen.fuel.consumedBeforeKg.toFixed(3)} − 本次 ${c.frozen.fuel.requiredKg} = 剩 ${c.frozen.fuel.remainingAfterKg.toFixed(3)} kg<br>
        🔒 窗口冻结: ${c.frozen.missionWindow.matchedWindow ? fmtT(c.frozen.missionWindow.matchedWindow.notBefore)+' ~ '+fmtT(c.frozen.missionWindow.matchedWindow.notAfter) : '无窗口约束'}<br>
        🔒 协同冻结: 对方计划 v${c.frozen.coordination.counterpartPlanVersion} · ${c.frozen.coordination.agreedMessages.length} 条已应用消息 · hash ${c.frozen.coordination.snapshotHash.slice(0,16)}…<br>
        批准人 ${c.approvedBy||'-'} · ${fmtT(c.createdAt)}${c.dispatchedAt ? ' · 下达 '+fmtT(c.dispatchedAt) : ''}
      </div>
      ${c.status==='APPROVED' ? `<button class="primary" style="margin-top:6px" onclick="dispatch('${c.id}')">下达机动</button>` : ''}
    </div>`).join('');

  // 协同记录
  $('coord-panel').style.display = 'block';
  $('export-json').href = `/api/coordination/export?eventId=${id}&format=json`;
  $('export-csv').href = `/api/coordination/export?eventId=${id}&format=csv`;
  $('d-msgs').querySelector('tbody').innerHTML = msgs.map(m => `
    <tr><td>${m.direction==='INBOUND'?'⬅ 入站':'➡ 出站'}</td><td class="mono">${m.id}</td>
      <td>${m.type}</td><td>v${m.version}</td>
      <td><span class="tag">${m.status}</span>${m.statusReason?` <span class="muted" title="${m.statusReason}">ⓘ</span>`:''}</td>
      <td class="mono">${fmtT(m.receivedAt)}</td></tr>`).join('');
  if (!silent) refresh(); // 更新列表选中态
}

async function ingest() {
  try {
    const [x,y,z,vx,vy,vz] = $('ing-state').value.split(',').map(Number);
    const r = await api('/api/orbit-solutions', { method:'POST', body: JSON.stringify({
      objectId: $('ing-object').value, source: $('ing-source').value, epoch: $('ing-epoch').value,
      state: {x,y,z,vx,vy,vz}, positionCovariance: JSON.parse($('ing-cov').value),
    })});
    toast(r.applied ? `轨道解已应用，更新 ${r.events.length} 个事件` : `迟到观测已存档（未回退版本），最新时点 ${r.latestEpoch}`);
    refresh();
  } catch(e) { toast(e.message, false); }
}
async function submitCandidate() {
  try {
    const [x,y,z] = $('c-dv').value.split(',').map(Number);
    await api(`/api/conjunctions/${selectedEvent}/maneuvers`, { method:'POST', body: JSON.stringify({
      objectId: $('c-object').value, operatorId: $('c-operator').value,
      dvVector: {x: x/1000, y: y/1000, z: z/1000},
      executionEpoch: $('c-exec').value, expectedFuelKg: Number($('c-fuel').value),
    })});
    toast('候选已提交'); refresh();
  } catch(e) { toast(e.message, false); }
}
async function approve(candId, head) {
  try {
    const c = await api(`/api/maneuvers/${candId}/approve`, { method:'POST',
      body: JSON.stringify({ expectedCommitmentVersion: head, approvedBy: 'OPS-A' })});
    toast(`承诺 ${c.id} v${c.version} 已创建（燃料/窗口/协同已冻结）`); refresh();
  } catch(e) { toast('批准失败: ' + e.message, false); refresh(); }
}
async function rejectCand(id) {
  try { await api(`/api/maneuvers/${id}/reject`, { method:'POST', body:'{}' }); toast('候选已拒绝'); refresh(); }
  catch(e) { toast(e.message, false); }
}
async function dispatch(id) {
  try { await api(`/api/commitments/${id}/dispatch`, { method:'POST', body: JSON.stringify({dispatchedBy:'OPS-A'}) });
    toast('机动已下达，承诺进入终态（不可撤销）'); refresh(); }
  catch(e) { toast(e.message, false); }
}
async function sendMessage() {
  try {
    const r = await api('/api/coordination/messages', { method:'POST', body: JSON.stringify({
      messageId: $('msg-id').value, counterpartId: $('msg-cp').value, eventId: $('msg-event').value,
      type: $('msg-type').value, version: Number($('msg-version').value),
      payload: JSON.parse($('msg-payload').value || '{}'),
    })});
    toast(r.deduplicated ? `重放消息已去重（原状态 ${r.status}）` : `消息受理: ${r.status}${r.reason?' - '+r.reason:''}`, r.status!=='REJECTED' && r.status!=='STALE_REJECTED');
    refresh();
  } catch(e) { toast(e.message, false); }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
